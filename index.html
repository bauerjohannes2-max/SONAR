<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SONAR: The Echo Chamber</title>
  <meta name="description" content="SONAR: The Echo Chamber - Ein gnadenloser 2D-Arcade-Stealth-Thriller im absoluten Nichts. Sicht existiert nur durch Schall.">
  
  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SONAR">
  <meta name="theme-color" content="#00f0ff">
  
  <!-- App Icons & Manifest -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/icon-192.png?v=1.10.1">
  <link rel="icon" type="image/png" href="./assets/icon-192.png?v=1.10.1">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;600;800&family=Share+Tech+Mono&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/main.css?v=1.10.1">
</head>
<body>
  <div id="game-wrapper">
    <!-- Canvas Container with CRT Filter Layer -->
    <div class="canvas-container">
      <canvas id="gameCanvas" width="800" height="576"></canvas>
      <div class="crt-overlay"></div>
      <div class="scanlines"></div>
      <div class="vignette"></div>

      <!-- Top-Right Quick-Actions (In-Game & Menu) -->
      <div class="canvas-quick-actions">
        <button id="btn-header-tutorial" class="canvas-action-btn" title="Anleitung & Briefing (T)">ℹ️</button>
        <button id="btn-header-fullscreen" class="canvas-action-btn" title="Vollbild umschalten (F)">⛶</button>
        <button id="btn-settings-gear" class="canvas-action-btn" title="Einstellungen (O)">⚙</button>
      </div>
    </div>

    <!-- Virtual Touch Controls for Mobile (Positioned Below Canvas) -->
    <div id="touch-controls" class="touch-controls-bar">
      <div class="touch-dpad" id="touch-dpad-container">
        <button class="dpad-btn dpad-up" id="touch-up" aria-label="Up">▲</button>
        <button class="dpad-btn dpad-down" id="touch-down" aria-label="Down">▼</button>
        <button class="dpad-btn dpad-left" id="touch-left" aria-label="Left">◀</button>
        <button class="dpad-btn dpad-right" id="touch-right" aria-label="Right">▶</button>
        <div class="dpad-center"></div>
      </div>

      <div class="touch-actions">
        <div class="touch-actions-row">
          <button class="touch-btn touch-btn-sneak" id="touch-sneak" title="Schleichen umschalten">
            <span class="sneak-icon">🤫</span>
            <span class="sneak-label">SCHLEICHEN</span>
            <span class="sneak-badge" id="touch-sneak-badge">AUS</span>
          </button>
          <button class="touch-btn touch-btn-decoy" id="touch-decoy" title="Köder werfen (E)">
            <span class="decoy-label">💣 KÖDER</span>
            <span class="decoy-count" id="touch-decoy-count">1/1</span>
          </button>
        </div>
        <button class="touch-btn touch-btn-ping" id="touch-ping" title="Sonar Ping (SPACE)">
          <span class="ping-icon">📡</span>
          <span class="ping-label" id="touch-ping-label">PING</span>
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js?v=1.10.1"></script>
</body>
</html>
