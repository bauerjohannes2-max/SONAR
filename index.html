<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SONAR: The Echo Chamber</title>
  <meta name="description" content="SONAR: The Echo Chamber - Taktisches Sci-Fi Tiefsee-Stealth & Echonavigation">
  <meta name="theme-color" content="#03070d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SONAR">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;600;800&family=Share+Tech+Mono&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/main.css?v=1.18.0">
</head>
<body>
  <div id="game-wrapper">
    <!-- Canvas Container with CRT Filter Layer -->
    <div class="canvas-container">
      <canvas id="gameCanvas" width="800" height="576"></canvas>
      <div class="crt-overlay"></div>

      <!-- In-Game Quick Action Overlay (Non-Intrusive) -->
      <div class="canvas-quick-actions">
        <button id="btn-header-tutorial" class="header-action-btn" title="Einsatz-Handbuch & Taktik (H)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </button>
        <button id="btn-settings-gear" class="header-action-btn" title="Einstellungen (O / ESC)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button id="btn-header-fullscreen" class="header-action-btn" title="Vollbild (F)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
        <button id="btn-header-mute" class="header-action-btn" title="Ton stummschalten / aktivieren (M)">
          <svg class="icon-speaker" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
      </div>

      <!-- Dynamic Danger Vignette Glow (Red Alert Proximity Pulse) -->
      <div id="danger-vignette" class="danger-vignette-overlay"></div>
    </div>

    <!-- Mobile Touch Controls Layer (Collision-Free Clustered D-Pad & Actions) -->
    <div id="touch-controls" class="touch-overlay">
      <!-- Ergonomic D-Pad (Left Safe-Area) -->
      <div id="touch-dpad-container" class="touch-dpad" data-touch-id="movement">
        <button class="dpad-btn dpad-up" id="touch-up">▲</button>
        <button class="dpad-btn dpad-down" id="touch-down">▼</button>
        <button class="dpad-btn dpad-left" id="touch-left">◀</button>
        <button class="dpad-btn dpad-right" id="touch-right">▶</button>
        <div class="dpad-center"></div>
      </div>

      <!-- Action Buttons Cluster (Right Safe-Area, Zero Overlap) -->
      <div class="touch-actions" id="touch-action-cluster">
        <div class="touch-actions-row">
          <button class="touch-btn touch-btn-sneak" id="btn-sneak" data-touch-id="touch-sneak" title="Schleichen Toggle (SHIFT)">
            <span class="sneak-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </span>
            <span class="touch-btn-badge" id="touch-sneak-badge">AUS</span>
          </button>
          <button class="touch-btn touch-btn-decoy" id="btn-bait" data-touch-id="touch-decoy" title="Köder / Decoy (F)">
            <span class="decoy-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7" stroke-dasharray="3 3"/></svg>
            </span>
            <span class="touch-btn-badge" id="touch-decoy-count">1/1</span>
          </button>
        </div>
        <button class="touch-btn touch-btn-ping" id="btn-ping" data-touch-id="touch-ping" title="Sonar Ping (SPACE)">
          <span class="ping-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 0 1 10 10"/><path d="M12 6a6 6 0 0 1 6 6"/><path d="M12 10a2 2 0 0 1 2 2"/><line x1="12" y1="12" x2="12" y2="22"/><circle cx="12" cy="12" r="1"/></svg>
          </span>
          <span class="ping-label" id="touch-ping-label">PING</span>
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js?v=1.18.0"></script>
</body>
</html>
