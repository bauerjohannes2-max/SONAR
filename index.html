<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SONAR: The Echo Chamber</title>
  <meta name="description" content="SONAR: The Echo Chamber - Ein gnadenloser 2D-Arcade-Stealth-Thriller im absoluten Nichts. Sicht existiert nur durch Schall.">
  
  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SONAR">
  <meta name="theme-color" content="#00f0ff">
  
  <!-- App Icons & Manifest -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="icon" type="image/png" href="./assets/icon-192.png">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;600;800&family=Share+Tech+Mono&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/main.css?v=2.5">
</head>
<body>
  <div id="game-wrapper">
    <!-- Canvas Container with CRT Filter Layer & Touch Controls Overlay -->
    <div class="canvas-container">
      <canvas id="gameCanvas" width="800" height="576"></canvas>
      <div class="crt-overlay"></div>
      <div class="scanlines"></div>
      <div class="vignette"></div>

      <!-- Top-Right Quick-Actions (In-Game & Menu) -->
      <div class="canvas-quick-actions">
        <button id="btn-header-fullscreen" class="canvas-action-btn" title="Vollbild umschalten (F)">⛶</button>
        <button id="btn-settings-gear" class="canvas-action-btn" title="Einstellungen (O)">⚙</button>
      </div>

      <!-- Virtual Touch Controls for Mobile -->
      <div id="touch-controls">
        <div class="touch-dpad">
          <button class="dpad-btn dpad-up" id="touch-up">▲</button>
          <button class="dpad-btn dpad-down" id="touch-down">▼</button>
          <button class="dpad-btn dpad-left" id="touch-left">◀</button>
          <button class="dpad-btn dpad-right" id="touch-right">▶</button>
          <div class="dpad-btn dpad-center"></div>
        </div>

        <div class="touch-actions">
          <div class="touch-actions-row">
            <button class="touch-btn touch-btn-sneak" id="touch-sneak" title="Schleichen">
              <span>🤫 SCHLEICHEN</span>
            </button>
            <button class="touch-btn touch-btn-decoy" id="touch-decoy" title="Köder werfen">
              <span>💣 KÖDER</span>
              <span id="touch-decoy-count">1/1</span>
            </button>
          </div>
          <button class="touch-btn touch-btn-ping" id="touch-ping" title="Sonar Ping">
            <span>📡 PING</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js?v=2.3"></script>
</body>
</html>
