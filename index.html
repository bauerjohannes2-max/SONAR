<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SONAR: The Echo Chamber</title>
  <meta name="description" content="SONAR: The Echo Chamber - Ein gnadenloser 2D-Arcade-Stealth-Thriller im absoluten Nichts. Sicht existiert nur durch Schall.">
  
  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SONAR">
  <meta name="theme-color" content="#00f0ff">
  
  <!-- App Icons & Manifest -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/icon-192.png?v=1.13.0">
  <link rel="icon" type="image/png" href="./assets/icon-192.png?v=1.13.0">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;600;800&family=Share+Tech+Mono&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/main.css?v=1.13.0">
</head>
<body>
  <div id="game-wrapper">
    <!-- Canvas Container with CRT Filter Layer -->
    <div class="canvas-container">
      <canvas id="gameCanvas" width="800" height="576"></canvas>
      <div class="crt-overlay"></div>
      <div class="scanlines"></div>
      <div class="vignette"></div>

      <!-- Top-Right Quick-Actions (In-Game & Menu) -->
      <div class="canvas-quick-actions">
        <button id="btn-header-tutorial" class="canvas-action-btn" title="Anleitung & Briefing (T)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        </button>
        <button id="btn-header-fullscreen" class="canvas-action-btn" title="Vollbild umschalten (F)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
        <button id="btn-settings-gear" class="canvas-action-btn" title="Einstellungen (O)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>

    <!-- Virtual Touch Controls for Mobile & Desktop Overlay -->
    <div id="touch-controls" class="touch-controls-bar">
      <div class="touch-dpad" id="touch-dpad-container">
        <button class="dpad-btn dpad-up" id="touch-up" aria-label="Up">▲</button>
        <button class="dpad-btn dpad-down" id="touch-down" aria-label="Down">▼</button>
        <button class="dpad-btn dpad-left" id="touch-left" aria-label="Left">◀</button>
        <button class="dpad-btn dpad-right" id="touch-right" aria-label="Right">▶</button>
        <div class="dpad-center"></div>
      </div>

      <div class="touch-actions">
        <div class="touch-actions-row">
          <button class="touch-btn touch-btn-sneak" id="btn-sneak" data-touch-id="touch-sneak" title="Schleichen umschalten (SHIFT)">
            <span class="sneak-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </span>
            <span class="sneak-label">SCHLEICHEN</span>
            <span class="sneak-badge" id="touch-sneak-badge">AUS</span>
          </button>
          <button class="touch-btn touch-btn-decoy" id="btn-bait" data-touch-id="touch-decoy" title="Köder werfen (E)">
            <span class="decoy-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="10" stroke-opacity="0.5"/></svg>
            </span>
            <span class="decoy-label">KÖDER</span>
            <span class="decoy-count" id="touch-decoy-count">1/1</span>
          </button>
        </div>
        <button class="touch-btn touch-btn-ping" id="btn-ping" data-touch-id="touch-ping" title="Sonar Ping (SPACE)">
          <span class="ping-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 0 1 10 10"/><path d="M12 6a6 6 0 0 1 6 6"/><path d="M12 10a2 2 0 0 1 2 2"/><line x1="12" y1="12" x2="12" y2="22"/><circle cx="12" cy="12" r="1"/></svg>
          </span>
          <span class="ping-label" id="touch-ping-label">PING</span>
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js?v=1.13.0"></script>
</body>
</html>
